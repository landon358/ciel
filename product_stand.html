<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciel Speaker Stands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="inner wall">
<header class="header solid">
  <a class="brand" href="index.html" aria-label="Ciel home"><img src="images/mark.svg" alt="Ciel"></a>
  <nav class="nav" aria-label="Main">
    <a aria-current="page" href="shop.html">Shop</a>
    <a href="about.html">About</a>
  </nav>
</header>
<main class="flow product">
  <section class="gallery" aria-label="Product images">
    <div class="main tall"><img id="mainImg" src="images/stand_1.jpg" alt="Sculpted ash speaker stand holding a black bookshelf speaker against a warm plaster wall"></div>
    <div class="thumbs">
      <button type="button" aria-pressed="true" data-src="images/stand_1.jpg" aria-label="View front"><img src="images/stand_1.jpg" alt=""></button>
      <button type="button" aria-pressed="false" data-src="images/stand_2.jpg" aria-label="View three quarter angle"><img src="images/stand_2.jpg" alt=""></button>
      <button type="button" aria-pressed="false" data-src="images/stand_3.jpg" aria-label="View the pair"><img src="images/stand_3.jpg" alt=""></button>
    </div>
  </section>

  <section class="info">
    <a class="eyebrow" href="shop.html">Shop</a>
    <h1 class="title">Racine Stands</h1>
    <div class="price_big">$1,900</div>
    <p class="desc">Sculpted ash. Brushed steel top.<br>Sold as a pair.</p>
    <div class="actions">
      <p class="status">Sold out</p>
      <button type="button" class="pill main" id="preorder">Preorder the next batch</button>
      <p class="note" id="note" aria-live="polite"></p>
    </div>
    <div class="notes">
      <div><h2>Details</h2><p>Solid ash, carved and hand oiled.</p></div>
      <div><h2>Dimensions</h2><p>Available on request.</p></div>
      <div><h2>Shipping</h2><p>Made to order in small batches.</p></div>
    </div>
  </section>
</main>
<footer class="footer">
  <span>&copy; 2026 Ciel</span>
  <nav class="links" aria-label="Legal">
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
  </nav>
  <a class="contact" href="#">Contact</a>
</footer>
<script>
(function () {
  var main = document.getElementById('mainImg');
  var thumbs = document.querySelectorAll('.thumbs button');
  thumbs.forEach(function (b) {
    b.addEventListener('click', function () {
      main.src = b.dataset.src;
      thumbs.forEach(function (t) { t.setAttribute('aria-pressed', t === b ? 'true' : 'false'); });
    });
  });
  document.getElementById('preorder').addEventListener('click', function () {
    document.getElementById('note').textContent = 'You are on the list for the next batch.';
  });
})();
</script>
</body>
</html>
