# Static site: no build step, publish the repo root.
# Netlify serves /products, /about, /contact, /terms and /privacy from the matching .html files.
[build]
  publish = "."
  command = ""

# Product pages. The Onde Clock has its own page; its copy loads live from Shopify (shop.js).
[[redirects]]
  from = "/products/onde-clock"
  to = "/onde-clock.html"
  status = 200

# Any other product address (drafted or not yet designed) goes to the products page.
[[redirects]]
  from = "/products/:handle"
  to = "/products"
  status = 302

# Old pages and URLs from the previous site.
[[redirects]]
  from = "/shop"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product.html"
  to = "/products/onde-clock"
  status = 301

