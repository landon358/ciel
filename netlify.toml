# Static site: no build step, publish the repo root.
# Netlify serves /products, /about, /contact, /terms and /privacy from the matching .html files.
[build]
  publish = "."
  command = ""

# Product pages. The Onde Clock has its own page; its copy loads live from Shopify (shop.js).
[[redirects]]
  from = "/products/onde-clock"
  to = "/onde-clock.html"
  status = 200

# Orbe Clock was renamed Halo Clock.
[[redirects]]
  from = "/products/orbe-clock"
  to = "/products/halo-clock"
  status = 301

# Every other product renders from Shopify on the shared template (product.html).
[[redirects]]
  from = "/products/:handle"
  to = "/product.html"
  status = 200

# Old pages and URLs from the previous site.
[[redirects]]
  from = "/shop"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product.html"
  to = "/products/onde-clock"
  status = 301

[[redirects]]
  from = "/item.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product_jug.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product_senufo.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product_shayd.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product_stand.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product_teak.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product_sheepskin.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/product_obelisk.html"
  to = "/products"
  status = 301

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Images and video change rarely; css/js are versioned with ?v= so they can cache too
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
