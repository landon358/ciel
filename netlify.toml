# Static site: no build step, publish the repo root.
# Netlify serves /shop, /about, /contact, /terms and /privacy from the matching .html files.
[build]
  publish = "."
  command = ""

# Clean product URLs. The Onde Clock keeps its custom page (sunset film); every
# other product renders from Shopify on item.html. Order matters: first match wins.
[[redirects]]
  from = "/products/onde-clock"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/products/:handle"
  to = "/item.html"
  status = 200

# Old URLs forward permanently to the clean ones.
[[redirects]]
  from = "/item.html"
  query = { h = ":h" }
  to = "/products/:h"
  status = 301

[[redirects]]
  from = "/product_jug.html"
  to = "/products/terracotta-jug"
  status = 301

[[redirects]]
  from = "/product_senufo.html"
  to = "/products/senufo-stool"
  status = 301

[[redirects]]
  from = "/product_shayd.html"
  to = "/products/shayd-table-lamp"
  status = 301

[[redirects]]
  from = "/product_stand.html"
  to = "/products/racine-stands"
  status = 301

[[redirects]]
  from = "/product_teak.html"
  to = "/products/teak-side-table"
  status = 301

[[redirects]]
  from = "/product_sheepskin.html"
  to = "/products/texel-sheepskin"
