<canvas id="ripple" class="ripple_bg" aria-hidden="true"></canvas>

<main id="main" class="contact">
  <div class="contact_intro">
    <h1>Get in touch</h1>
    <p>Questions about a piece, a preorder, or an order you have placed. We reply within two business days.</p>
  </div>

  <form class="contact_form" id="contactForm" name="contact" method="POST" action="/contact?sent=1" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact">
    <p hidden><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
    <div class="field_row">
      <label class="field"><span>Name</span><input name="name" type="text" autocomplete="name" required></label>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
    </div>
    <label class="field"><span>Topic</span>
      <select name="topic">
        <option>A piece or preorder</option>
        <option>An order, return or warranty</option>
        <option>Trade and press</option>
        <option>Something else</option>
      </select>
    </label>
    <label class="field"><span>Message</span><textarea name="message" rows="5" required></textarea></label>
    <button type="submit" class="send">Send message <span aria-hidden="true">&rarr;</span></button>
    <p class="contact_sent" id="sent" aria-live="polite"></p>
  </form>
</main>
