<script>
(function () {
  var rail = document.getElementById('rail');
  // Mouse users: drag the row sideways, or use the scroll wheel over it
  var drag = null;
  rail.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse') return;
    drag = { x: e.clientX, left: rail.scrollLeft };
    rail.classList.add('dragging');
  });
  window.addEventListener('pointermove', function (e) {
    if (drag) rail.scrollLeft = drag.left - (e.clientX - drag.x);
  });
  window.addEventListener('pointerup', function () { drag = null; rail.classList.remove('dragging'); });
  rail.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    var max = rail.scrollWidth - rail.clientWidth;
    if ((e.deltaY > 0 && rail.scrollLeft < max) || (e.deltaY < 0 && rail.scrollLeft > 0)) {
      rail.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });



})();
</script>
